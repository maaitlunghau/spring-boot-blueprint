name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: spring-boot-blueprint
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci_rabbitmq
          RABBITMQ_DEFAULT_PASS: ci_rabbitmq_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: dev
      MYSQL_HOST: localhost
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
      REDIS_HOST: localhost
      # CI's redis service has no --requirepass (GitHub Actions services can't
      # override the container command) — empty password, unlike local/prod compose.
      REDIS_PASSWORD: ""
      JWT_SECRET: ci-only-dummy-jwt-secret-not-used-anywhere-real
      # Dummy values — CI only loads the Spring context (contextLoads test), never
      # calls the real Cloudinary API, so these just need to be non-empty.
      CLOUDINARY_CLOUD_NAME: ci-dummy-cloud-name
      CLOUDINARY_API_KEY: ci-dummy-api-key
      CLOUDINARY_API_SECRET: ci-dummy-api-secret
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ci_rabbitmq
      RABBITMQ_PASSWORD: ci_rabbitmq_password
      # Dummy values — CI only loads the Spring context (contextLoads test), never
      # sends a real email, so these just need to be non-empty.
      MAIL_HOST: localhost
      MAIL_PORT: 25
      MAIL_USERNAME: ci-dummy@example.com
      MAIL_PASSWORD: ci-dummy-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t spring-boot-blueprint:ci .
