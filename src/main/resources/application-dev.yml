spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/spring-boot-blueprint?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false
