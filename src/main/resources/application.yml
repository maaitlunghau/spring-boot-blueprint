# spring.application.name=spring-boot-blueprint

spring:
  application:
    name: spring-boot-blueprint

  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:3306/spring-boot-blueprint?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  server:
    port: 8081

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 300000
    refresh-token-expiration: 604800000
    refresh-token-absolute-expiration: 2592000000